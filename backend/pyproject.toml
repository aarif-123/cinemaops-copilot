[project]
name = "cinemaops-backend"
version = "1.0.0"
description = "CinemaOps Copilot — Agentic Theater Control & Yield Engine"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.0",
    "websockets==13.1",

    # Pydantic / settings
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",

    # LangGraph + LangChain tooling
    "langgraph==0.2.52",
    "langgraph-checkpoint-mongodb==0.1.4",
    "langchain==0.3.7",
    "langchain-mongodb==0.6.1",
    "langchain-groq==0.2.1",
    "langchain-core==0.3.21",

    # MongoDB
    "motor==3.7.1",
    "pymongo==4.12.1",

    # Redis + Redlock
    # pottery 3.0.0 supports redis-py 4.x only.
    "redis==4.6.0",
    "pottery==3.0.0",          # Pythonic Redlock implementation on top of redis-py

    # Auth / JWT
    "python-jose[cryptography]==3.3.0",
    "httpx==0.27.2",

    # Utilities
    "python-dotenv==1.0.1",
    "orjson==3.10.11",
    "jsonpatch==1.33",          # RFC 6902 JSON Patch
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.2",
    "ruff==0.7.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
